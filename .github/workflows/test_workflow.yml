name: test_workflow

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build_test_and_ipa:
    name: Build, Unit Test and Create IPA
    runs-on: macos-13

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            Pods
            ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-cocoapods-${{ hashFiles('**/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-cocoapods-

      - name: Setup CocoaPods
        run: |
          gem install cocoapods
          pod install --repo-update

      - name: Build and Run Unit Tests
        run: |
          set -o pipefail
          DESTINATION=$(xcrun simctl list devices available | grep -m 1 "iPhone" | sed -E 's/.*\(([A-F0-9-]+)\).*/\1/')
          xcodebuild \
            -workspace "Pocket Contacts Pro.xcworkspace" \
            -scheme "Pocket Contacts Pro" \
            -destination "platform=iOS Simulator,id=${DESTINATION}" \
            -configuration Debug \
            clean test \
            CODE_SIGNING_ALLOWED=NO

      - name: Archive Application
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -workspace "Pocket Contacts Pro.xcworkspace" \
            -scheme "Pocket Contacts Pro" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$PWD/build/PocketContactsPro.xcarchive" \
            clean archive \
            CODE_SIGNING_ALLOWED=NO

      - name: Create IPA
        run: |
          mkdir -p build/ipa/Payload
          cp -R "build/PocketContactsPro.xcarchive/Products/Applications/Pocket Contacts Pro.app" build/ipa/Payload/
          cd build/ipa
          zip -r "../PocketContactsPro.ipa" Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PocketContactsPro-IPA
          path: build/PocketContactsPro.ipa
          if-no-files-found: error
